[package]
name = "loveworldagent"
version = "0.1.0"
description = "爱满天下桌面端"
authors = ["LoveWorldAgent"]
edition = "2021"
build = "build.rs"

[lib]
name = "loveworldagent"
path = "src/lib.rs"

[[bin]]
name = "loveworldagent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
portable-pty = "0.9"
conpty-oxide = { version = "0.1.2", features = ["tokio"] }
tokio-util = "0.7"
base64 = "0.22"
walkdir = "2"
once_cell = "1"
parking_lot = "0.12"
glob = "0.3"
mime_guess = "2"
open = "5"
aes-gcm = "0.10"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }
goose-agent = "=0.1.0-alpha.13"
goose-provider-types = "=0.1.0-alpha.13"
goose-providers = { version = "=0.1.0-alpha.13", features = ["native-tls"] } # 使用 Windows Schannel，避免 rustls/aws-lc 额外构建依赖
goose-context-management = "=0.1.0-alpha.13"
rmcp = { version = "3", default-features = false }
async-trait = "0.1"
