<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>爱满天下</title>
    <link rel="icon" href="/dragon.png" />
    <style>html,body{margin:0;min-height:100%;background:#181818;}html:not(.dark),html:not(.dark) body{background:#ffffff;}</style>
    <script>
      try {
        var theme = localStorage.getItem('ui-theme') || 'dark'
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.documentElement.style.backgroundColor = dark ? '#181818' : '#ffffff'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
